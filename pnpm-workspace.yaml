# 功能：声明 LFAA 使用 pnpm 管理的工作区包。
# 作用：纳入当前运行工作区和按领域组织的 packages/*/* 目标包目录。
# 关联文件：根目录 package.json、各工作区的 package.json、docs/系统总体架构.md。
packages:
  - apps/*
  - packages/*/*

overrides:
  '@electron/get': 3.1.0
  body-parser: 1.20.9
  fast-uri: 3.1.9
  undici: 6.29.1
  # 统一直接与数学 Markdown 间接依赖，修复继承 trust 属性绕过限制的 GHSA-238p-pmpm-9mq7。
  katex: 0.18.2

# PTY 使用官方依赖内的原生预编译文件；保留安装脚本禁用，避免在包目录生成构建输出。
allowBuilds:
  esbuild: true
  electron: true
  node-pty: false
  electron-winstaller: false

patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
