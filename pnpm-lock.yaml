lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

# Release source lockfile keeps only workspace importer identities. The stable
# Windows workspace will materialize the full pnpm resolution once when
# dependency declarations change, then Sync preserves that full lock while
# declarations remain unchanged.
importers:
  .: {}
  apps/web: {}
  packages/agent-runtime: {}
  packages/app-shell: {}
  packages/config-system: {}
  packages/credentials: {}
  packages/plugin-host-node: {}
  packages/plugin-runtime: {}
  packages/plugin-sdk: {}
  packages/ui: {}
  packages/workspace: {}
