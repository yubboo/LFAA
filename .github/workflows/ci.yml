# LFAA 持续集成：在 Windows runner 上跑完整门禁。
# 选择 windows-latest 是因为仓库有 Windows 专有实现与测试（COM 文件选择器、taskkill、SAPI、pwsh）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只需要读代码；不写回仓库、不发版。
permissions:
  contents: read

# 同一分支的新推送取消上一次未完成的运行，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / typecheck / test / build / probe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 关掉 pnpm 的更新提示与遥测，减少无关输出。
      NO_COLOR: "1"
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 packageManager）
        uses: pnpm/action-setup@v4

      - name: 安装 Node 24 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（锁定版本）
        run: pnpm install --frozen-lockfile

      # vendor/loader 与部分包的 lib 被 .gitignore 忽略，全新检出没有产物；测试与 Loader 探针按包名运行前必须先构建。
      - name: 预构建运行期 lib 产物
        run: node scripts/ensure-lib.mjs

      - name: 仓库边界、规模与主题色规则
        run: pnpm check

      - name: AST Lint（未使用导入 / any / 调试输出 / 抑制指令）
        run: pnpm lint

      - name: README 双语配对
        run: pnpm readme:pair -- .

      - name: 类型检查
        run: pnpm typecheck

      # 失败时把失败用例写成 annotation 与 job summary，避免必须登录才能看原始日志。
      - name: 单元测试
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          pnpm test 2>&1 | Tee-Object -Variable testOutput | Out-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failures = @($testOutput | Select-String -Pattern '^(✖|  ✖)|failing tests|AssertionError|Error: |test at ' | Select-Object -First 40)
            foreach ($failure in $failures) { Write-Host "::error title=单元测试失败::$($failure.Line.Trim())" }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## 单元测试失败摘要" -Encoding utf8
            foreach ($failure in $failures) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- " + $failure.Line.Trim()) -Encoding utf8 }
          }
          exit $code

      - name: 完整构建
        run: pnpm build

      - name: Loader 按包名装载探针
        run: pnpm probe:loader

      # 生产构建产物的浏览器验收：起静态宿主后用本机 Edge/Chrome 无头检查壳层、资料库、代码审查、设置页与双主题。
      # 没有可用浏览器时脚本自行跳过并以 0 退出（见 scripts/verify-web.mts）。
      - name: 生产构建浏览器验收
        run: pnpm verify:web