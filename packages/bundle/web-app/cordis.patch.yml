# 功能：定义 Web 装配补丁。作用：加载可撤销 API 控制器和 HTTP Host。关联文件：各 api 包。
- insert:
    - id: api-gateway
      name: lfaa-api-gateway
      required: true
    - id: api-account-controller
      name: lfaa-api-account-controller
      inject: [apiGateway]
    - id: api-writing-controller
      name: lfaa-api-writing-controller
      inject: [apiGateway]
    - id: api-session-controller
      name: lfaa-api-session-controller
      inject: [apiGateway]
    - id: api-settings-controller
      name: lfaa-api-settings-controller
      inject: [apiGateway]
      required: true
    - id: api-minecraft-controller
      name: lfaa-api-minecraft-controller
      inject: [apiGateway]
    - id: api-steamcmd-controller
      name: lfaa-api-steamcmd-controller
      inject: [apiGateway]
    - id: api-workspace-files
      name: lfaa-api-workspace-files
      inject: [apiGateway]
    - id: api-job-controller
      name: lfaa-api-job-controller
      inject: [apiGateway]
    - id: webserver
      name: lfaa-host-webserver
      inject: [apiGateway, aiExtensions, aiRuntimeHooks, lfaaSettings, lfaaAuth, lfaaMinecraft, lfaaSteamcmd, lfaaWriting]
      required: true
