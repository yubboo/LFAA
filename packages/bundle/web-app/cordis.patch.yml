# 功能：定义 Web 装配补丁。作用：加载可撤销 API 控制器和 HTTP Host。关联文件：各 api 包。
- insert:
    - id: api-gateway
      name: lfaa-api-gateway
      inject: [lfaaTypertRegistry]
      required: true
    - id: api-account-controller
      name: lfaa-api-account-controller
      inject: [apiGateway, lfaaTypertLoader]
    - id: api-writing-controller
      name: lfaa-api-writing-controller
      inject: [apiGateway]
    - id: api-attachment-controller
      name: lfaa-api-attachment-controller
      inject: [apiGateway, lfaaAttachments]
    - id: api-knowledge-controller
      name: lfaa-api-knowledge-controller
      inject: [apiGateway]
    - id: api-session-controller
      name: lfaa-api-session-controller
      inject: [apiGateway, lfaaAgentLoop, lfaaUserApproval]
    - id: api-terminal-controller
      name: lfaa-api-terminal-controller
      inject: [apiGateway]
    - id: api-workflow-controller
      name: lfaa-api-workflow-controller
      inject: [apiGateway, lfaaWorkflow]
    - id: llm-local-runtime
      name: lfaa-llm-local-runtime
      inject: []
    - id: llm-moss-image
      name: lfaa-llm-moss-image
      inject: [lfaaSubprocess, lfaaLocalModelRuntime]
    - id: llm-minimax-h3
      name: lfaa-llm-minimax-h3
      inject: [lfaaSubprocess, lfaaLocalModelRuntime]
    - id: video-ai-video
      name: lfaa-video-ai-video
      inject: [lfaaCredentials, lfaaSettings, lfaaLocalModelRuntime]
    - id: api-ai-video-controller
      name: lfaa-api-ai-video-controller
      inject: [apiGateway, lfaaAiVideo]
    - id: api-local-model-controller
      name: lfaa-api-local-model-controller
      inject: [apiGateway, lfaaLocalModelRuntime]
    - id: tool-ai-video
      name: lfaa-video-tool-ai-video
      inject: [lfaaAiVideo, lfaaTools]
    - id: canvas
      name: lfaa-canvas
      inject: []
    - id: api-canvas-controller
      name: lfaa-api-canvas-controller
      inject: [apiGateway, lfaaCanvas, lfaaCanvasGeneration]
    - id: canvas-generation
      name: lfaa-canvas-generation
      inject: [lfaaCanvas, lfaaSettings, lfaaCredentials]
    - id: tool-canvas
      name: lfaa-canvas-tool-canvas
      inject: [lfaaCanvas, lfaaTools]
    - id: api-settings-controller
      name: lfaa-api-settings-controller
      inject: [apiGateway, lfaaAttachments]
      required: true
    - id: api-github-connection-controller
      name: lfaa-api-github-connection-controller
      inject: [apiGateway, lfaaGithubIntegration]
    - id: api-minecraft-controller
      name: lfaa-api-minecraft-controller
      inject: [apiGateway]
    - id: api-connectivity-controller
      name: lfaa-api-connectivity-controller
      inject: [apiGateway, lfaaGameConnectivity]
    - id: api-plugin-controller
      name: lfaa-api-plugin-controller
      inject: [apiGateway, lfaaPluginManager, lfaaCapabilityInstalls]
    - id: api-steamcmd-controller
      name: lfaa-api-steamcmd-controller
      inject: [apiGateway]
    - id: api-workspace-files
      name: lfaa-api-workspace-files
      inject: [apiGateway]
    - id: api-workspace-controller
      name: lfaa-api-workspace-controller
      inject: [apiGateway]
    - id: api-agent-git-controller
      name: lfaa-api-agent-git-controller
      inject: [apiGateway]
    - id: api-job-controller
      name: lfaa-api-job-controller
      inject: [apiGateway]
    - id: webserver
      name: lfaa-host-webserver
      inject: [apiGateway, skills, aiExtensions, aiRuntimeHooks, lfaaSettings, lfaaAuth, lfaaMinecraft, lfaaSteamcmd, lfaaWriting]
      required: true
    - id: dsh-client-modules
      name: '@deepseek-ai/dsh-client-modules'
      inject: [webServer]
      required: true
    - id: dsh-client-ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'
      required: true
    - id: dsh-client-hmr
      name: '@deepseek-ai/dsh-client-hmr'
      inject: [clientModules, webServer]
      config:
        pollIntervalMs: 1000
      required: true
