<!-- LFAA Web 文档入口：挂载由 apps/web/src/main.tsx 装配的工作台插件。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="LFAA 智能工作区" />
    <title>LFAA 工作区</title>
    <script>
      // 首屏绘制前完整恢复主题色、液态玻璃标记与强调色，避免页面刷新瞬间闪白或色偏。
      try {
        const root = document.documentElement;
        const ACCENTS = {
          blue: "#3B82F6",
          green: "#10B981",
          yellow: "#EAB308",
          pink: "#E66AA8",
          sakura: "#C9558A",
          orange: "#F97316",
          purple: "#8B5CF6",
          white: "#F5F5F4",
        };
        // 必须与 contract/index.ts 的 THEME_PRESETS 保持同步：漏登记会让新预设首屏回退成旧的偏色/玻璃标记。
        const PRESET_GLASS = { liquidGlass: true, classic: false, softMist: true, midnightInk: true, sakura: true };
        const LEGACY_HEX = {
          "#EEF2EE": "#FFFFFF",
          "#1E221F": "#171717",
          "#121519": "#181818",
          "#F2F4F2": "#F3F3F3",
        };
        const storedMode = localStorage.getItem("lfaa:appearance-mode");
        const rawConfig = localStorage.getItem("lfaa:appearance-config-v1") ?? localStorage.getItem("lfaa:appearance-config");
        const cfg = rawConfig ? JSON.parse(rawConfig) : null;
        const mode = ["light", "dark", "system"].includes(cfg?.mode ?? storedMode ?? "")
          ? (cfg?.mode ?? storedMode)
          : "system";
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const scheme = mode === "system" ? (systemDark ? "dark" : "light") : mode;
        const preset = cfg && typeof cfg.preset === "string" && cfg.preset in PRESET_GLASS ? cfg.preset : "liquidGlass";
        const variant = cfg && cfg[scheme] && typeof cfg[scheme] === "object" ? cfg[scheme] : null;
        const rawBg = variant && /^#[0-9a-fA-F]{6}$/.test(variant.background)
          ? variant.background.toUpperCase()
          : (scheme === "dark" ? "#181818" : "#FFFFFF");
        const rawFg = variant && /^#[0-9a-fA-F]{6}$/.test(variant.foreground)
          ? variant.foreground.toUpperCase()
          : (scheme === "dark" ? "#F3F3F3" : "#171717");
        const bg = LEGACY_HEX[rawBg] ?? rawBg;
        const fg = LEGACY_HEX[rawFg] ?? rawFg;
        const accentId = variant?.accent ?? "pink";
        const accent = accentId === "custom" && /^#[0-9a-fA-F]{6}$/.test(variant?.customAccent ?? "")
          ? variant.customAccent.toUpperCase()
          : (accentId === "default" ? (scheme === "dark" ? "#E5E7EB" : "#171717") : (ACCENTS[accentId] ?? "#E66AA8"));
        const hexTuple = (hex) => `${parseInt(hex.slice(1, 3), 16)} ${parseInt(hex.slice(3, 5), 16)} ${parseInt(hex.slice(5, 7), 16)}`;

        root.dataset.theme = mode;
        root.dataset.resolvedTheme = scheme;
        root.dataset.preset = preset;
        root.dataset.glass = String(PRESET_GLASS[preset]);
        root.dataset.glassSidebar = String(cfg?.translucentSidebar ?? true);
        root.dataset.reducedMotion = cfg?.reducedMotion ?? "system";
        root.dataset.pointerCursor = String(cfg?.pointerCursor ?? true);
        root.dataset.diffMarker = cfg?.diffMarker ?? "color";

        root.style.setProperty("--user-bg", bg);
        root.style.setProperty("--user-bg-rgb", hexTuple(bg));
        root.style.setProperty("--user-fg", fg);
        root.style.setProperty("--color-accent", accent);
        root.style.setProperty("--color-accent-rgb", hexTuple(accent));
        root.style.setProperty("--glass-contrast", (((typeof cfg?.contrast === "number" ? cfg.contrast : 60) / 100)).toFixed(2));
        root.style.backgroundColor = bg;
        root.style.color = fg;

        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", bg);
      } catch {
        document.documentElement.dataset.theme = "system";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
